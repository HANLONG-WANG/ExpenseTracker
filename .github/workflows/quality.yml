name: quality

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-unit-and-supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install contract parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Verify frozen baseline, P36 release gates, and P37 host contracts
        run: |
          python3 scripts/validate_spec_baseline.py
          python3 scripts/validate_p01_baseline.py
          ./gradlew p36Check p37HostCheck p36Artifacts koverXmlReport koverHtmlReport --no-daemon --configuration-cache --console=plain
      - name: Prove source policies reject real violations
        run: |
          python3 scripts/prove_p01_architecture_rejection.py
          python3 scripts/prove_p01_strict_lock_rejection.py
          python3 scripts/prove_source_policy_rejection.py
          python3 scripts/prove_p03_policy_rejection.py
      - name: Generate OSS license inventory
        run: ./gradlew generateLicenseReport --no-daemon --no-configuration-cache --no-parallel --console=plain
      - name: Upload auditable quality artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          if-no-files-found: error
          path: |
            build/reports/detekt/
            build/reports/kover/
            build/reports/cyclonedx/
            build/reports/dependency-license/
            build/reports/security/
            build/reports/release/
            build/reports/release/p36-artifacts.sha256
            app/build/outputs/bundle/release/app-release.aab
            **/build/reports/lint-results-*.html
            **/build/test-results/

  managed-device-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ADB_INSTALL_TIMEOUT: "10"
    strategy:
      fail-fast: false
      matrix:
        device:
          - pixel2Api28
          - pixel6Api36
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run complete API-specific P37 emulator and interaction-performance matrix
        run: ./gradlew p37${{ matrix.device == 'pixel2Api28' && 'Api28' || 'Api36' }}DeviceCheck --no-daemon --configuration-cache --console=plain
      - name: Upload device results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-device-${{ matrix.device }}
          if-no-files-found: error
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
            benchmark/build/reports/androidTests/managedDevice/
            benchmark/build/outputs/androidTest-results/managedDevice/
            benchmark/build/outputs/managed_device_android_test_additional_output/
            core/database/build/reports/androidTests/managedDevice/
            core/database/build/outputs/androidTest-results/managedDevice/
            core/designsystem/build/reports/androidTests/managedDevice/
            core/designsystem/build/outputs/androidTest-results/managedDevice/
            core/security/build/reports/androidTests/managedDevice/
            core/security/build/outputs/androidTest-results/managedDevice/
            finance/data/build/reports/androidTests/managedDevice/
            finance/data/build/outputs/androidTest-results/managedDevice/
