meta:
  name: Android 记账软件页面与路由契约
  version: 1.0.0
  screenCount: 215
  navigationRules:
  - 'Root navigation owns five independent back stacks: record, journal, accounts, budget, analysis.'
  - Routes carry stable IDs, enum values or saved filter/report IDs only.
  - Routes never carry amount, note, card number, attachment content or full domain objects.
  - App lock and maintenance gates intercept all business destinations.
  - Feature modules expose route keys and destination factories; they do not navigate to another feature implementation directly.
screens:
- id: G-001
  group: 全局运行态
  module: :app
  route: session-gate
  title: 会话入口
  presentation: system
  params: []
  result: null
  primaryComponents:
  - LedgerSessionGate
  requiredStates:
  - uninitialized
  - locked
  - opening
  - maintenance
  - recoveryRequired
  - ready
  notes:
  - 唯一根入口；不显示业务数据。
  requirementTags: []
- id: G-002
  group: 全局运行态
  module: :core:security
  route: app-lock
  title: 应用已锁定
  presentation: fullScreen
  params: []
  result: null
  primaryComponents:
  - LockScreen
  - AuthenticationAction
  requiredStates:
  - biometricAvailable
  - credentialOnly
  - authenticating
  - authFailed
  - lockedOut
  notes:
  - 禁止截屏时继承 FLAG_SECURE；认证成功只解锁应用 UI，不解锁保险库。
  requirementTags: []
- id: G-003
