<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分类管理 · 双用途分组</title>
<style>html,body{margin:0;height:100%;background:#f7f7ef}iframe{display:block;width:100%;height:100%;border:0}</style>
<iframe id="reference" title="分类管理设计"></iframe>
<script>
const params=new URLSearchParams(location.search);
const theme=['magazine','journal','objects'].includes(params.get('theme'))?params.get('theme'):'magazine';
const language=params.get('language')==='ja'?'ja':'zh';
const income=params.get('income')==='empty'?'empty':'populated';
const frame=document.getElementById('reference');
frame.onload=()=>frame.contentWindow.eval(`(()=>{
  const language=${JSON.stringify(language)},income=${JSON.stringify(income)};
  book().language=language;book().name=book().ja='生活';
  book().categories=[{id:'food',name:['餐饮','餐饮'],icon:'category'},{id:'coffee',parent:'food',name:['咖啡','咖啡'],icon:'category'}];
  book().incomeCategories=income==='empty'?[]:[{id:'work',name:'收入',icon:'category'},{id:'salary',parent:'work',name:'工资',icon:'category'}];
  // Keep this unchanged panel on its original reference styling; category badge changes only move it vertically.
  document.body.dataset.categoryManagementReference='true';
  const style=document.createElement('style');
  style.textContent='.magazine[data-category-management-reference] .audit-favorites{margin:25px 0;padding:22px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}';
  document.head.appendChild(style);
  screens.categories=()=>favoritesManagementBefore()+
    auditPanel('favorites',t('常用分类快捷入口','よく使うカテゴリのショートカット'),'<details class="entry-details"><summary>'+t('设置常用 / 一级或二级均可','よく使うカテゴリを設定・親も子も可')+'</summary>'+[...book().categories,...book().incomeCategories].map(c=>'<button class="audit-link" data-supplement-favorite>☆ '+esc(c.parent?categoryName([...book().categories,...book().incomeCategories].find(p=>p.id===c.parent))+' / '+categoryName(c):categoryName(c))+'</button>').join('')+'</details>');
  document.addEventListener('click',e=>{const button=e.target.closest('[data-supplement-favorite]');if(button)button.textContent=(button.textContent.startsWith('☆')?'★':'☆')+button.textContent.slice(1);});
  navigate('categories');
})()`);
frame.src='app.html?theme='+theme;
</script>
</html>
