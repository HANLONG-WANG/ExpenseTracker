<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>余量 · 删除与恢复影响预览</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme-system.css"><link rel="stylesheet" href="themes/magazine.css"><link rel="stylesheet" href="themes/journal.css"><link rel="stylesheet" href="themes/objects.css"><link rel="stylesheet" href="experience.css">
<style>
.preview{max-width:390px;margin:auto;padding:24px 25px;font-family:var(--font-body);color:var(--ink)}.preview h1{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.6;margin:0 0 20px}.preview p{font-size:11px;line-height:1.9;color:var(--muted);margin:0 0 15px}.impact-fact{padding:16px 0;border-bottom:1px solid var(--line)}.impact-fact small{display:block;color:var(--muted);font-size:9px;line-height:1.9}.impact-fact b{display:block;font-family:var(--font-number);font-weight:400;font-size:21px;line-height:1.6;margin-top:6px;overflow-wrap:anywhere}.journal .impact-fact{padding:15px 0;border-bottom-style:dashed}.journal .impact-fact small{font-size:11px;color:var(--warm,#ae6657)}.journal .impact-fact b{line-height:1.7;color:var(--accent)}.objects .impact-fact{padding:12px;background:#ffffff60;border:0;border-radius:10px;margin-bottom:8px}.objects .impact-fact b{color:var(--accent)}.preview button{margin-top:20px;width:100%;cursor:pointer}
</style></head><body><article class="preview" id="preview"></article>
<script>
const q=new URLSearchParams(location.search),theme=q.get('theme')||'magazine',ja=q.get('language')==='ja',restore=q.get('action')==='restore';document.body.className=theme;document.documentElement.lang=ja?'ja':'zh-CN';const t=(zh,jp)=>ja?jp:zh;
const facts=[[t('现金 · 余额','現金・残高'),restore?'¥10,000 → ¥9,700':'¥9,700 → ¥10,000'],['2026-10 · '+t('消费统计','支出集計'),restore?'¥0 → ¥300':'¥300 → ¥0'],[t('当月预算内还能花','今月の予算内で使える'),restore?'¥10,000 → ¥9,700':'¥9,700 → ¥10,000']];
document.querySelector('#preview').innerHTML=`<h1>${restore?t('恢复原记录','記録を復元'):t('移至回收站','ごみ箱に移動')}</h1><p>${t('保留30天。恢复原记录及其关联，不会新增一笔。','30日間保存。元の記録と関連を復元し、新しい記録は作りません。')}</p><div class="impact-preview">${facts.map(([label,value],i)=>`<div class="impact-fact" data-row="${i}"><small>${label}</small><b>${value}</b></div>`).join('')}</div><button class="full-button">${restore?t('恢复原记录','記録を復元'):t('确认移至回收站','ごみ箱へ移動')}</button>`;
</script></body></html>
