syntax = "proto3";

option java_package = "app.ledger.app.settings";
option java_multiple_files = true;

enum OnboardingStepProto {
  ONBOARDING_STEP_LANGUAGE = 0;
  ONBOARDING_STEP_BASE_CURRENCY = 1;
  ONBOARDING_STEP_TIME_ZONE = 2;
  ONBOARDING_STEP_PRIVACY_POLICY = 3;
  ONBOARDING_STEP_TELEMETRY = 4;
  ONBOARDING_STEP_APP_LOCK = 5;
  ONBOARDING_STEP_BACKUP = 6;
  ONBOARDING_STEP_ACCOUNT = 7;
  ONBOARDING_STEP_CATEGORY = 8;
  ONBOARDING_STEP_COMPLETE = 9;
}

enum SessionRestorePolicyProto {
  SESSION_RESTORE_SHORT_BACKGROUND = 0;
  SESSION_RESTORE_ALWAYS_LAST_PAGE = 1;
}

message RouteArgumentProto {
  string name = 1;
  string encoded_value = 2;
}

message DestinationProto {
  string screen_id = 1;
  repeated RouteArgumentProto arguments = 2;
}

message TopLevelStackProto {
  string top_level = 1;
  repeated DestinationProto destinations = 2;
  string scroll_key = 3;
  int32 scroll_offset = 4;
}

message NavigationSnapshotProto {
  string selected_top_level = 1;
  repeated TopLevelStackProto stacks = 2;
}

message LedgerAppSettings {
  bool onboarding_complete = 1;
  OnboardingStepProto onboarding_step = 2;
  string language_tag = 3;
  string base_currency = 4;
  string zone_id = 5;
  bool privacy_accepted = 6;
  bool telemetry_enabled = 7;
  bool crash_reporting_enabled = 8;
  bool app_lock_enabled = 9;
  int64 app_lock_timeout_millis = 10;
  bool recovery_password_configured = 11;
  bytes recovery_wrapped_verifier = 12;
  bytes book_id = 13;
  bool first_account_created = 14;
  bool first_category_created = 15;
  SessionRestorePolicyProto restore_policy = 16;
  NavigationSnapshotProto navigation_snapshot = 17;
  bool unsaved_content_loss_pending = 18;
  repeated string visible_currency_codes = 19;
  bool diagnostics_choice_recorded = 20;
  bool global_flag_secure = 21;
  bool obscure_recent_tasks = 22;
  int32 trash_retention_days = 23;
  bool security_settings_initialized = 24;
}
